# =============================================================================
# ByteSized Suite — Kubernetes Deployment
# 3-replica rolling deployment with health probes, resource limits,
# graceful shutdown (terminationGracePeriodSeconds), and anti-affinity.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bytesized-backend
  namespace: bytesized-prod
  labels:
    app.kubernetes.io/name: bytesized
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "2.0.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    deployment.kubernetes.io/revision: "1"
    bytesized.io/description: "ByteSized FastAPI ASGI backend — RTL, code optimizer, BlueprintBob"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bytesized
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # zero-downtime: new pods must be ready before old are terminated
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bytesized
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # Force pod restart when ConfigMap or Secret changes
        checksum/config: "placeholder-replaced-by-helm"
        checksum/secret: "placeholder-replaced-by-helm"
    spec:
      # ---- Security ----
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # ---- Service Account ----
      serviceAccountName: bytesized-backend
      automountServiceAccountToken: false

      # ---- Termination Grace Period (allows WebSocket draining) ----
      terminationGracePeriodSeconds: 60

      # ---- Anti-Affinity: spread pods across nodes ----
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["bytesized"]
              topologyKey: kubernetes.io/hostname

      # ---- Init Container: wait for Redis ----
      initContainers:
        - name: wait-for-redis
          image: redis:7.2-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until redis-cli -h bytesized-redis -a "$REDIS_PASSWORD" ping | grep -q PONG; do
                echo "Redis not ready, retrying in 2s..."
                sleep 2
              done
              echo "Redis is ready."
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bytesized-secrets
                  key: redisPassword
          resources:
            limits:
              cpu: "100m"
              memory: "32Mi"

      # ---- Main Container ----
      containers:
        - name: backend
          image: ghcr.io/gagan7350/bytesized-backend:2.0.0
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          command:
            - uvicorn
            - backend.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "$(UVICORN_WORKERS)"
            - --log-level
            - "$(LOG_LEVEL)"
            - --proxy-headers
            - --forwarded-allow-ips=*

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # ---- Environment (from ConfigMap) ----
          envFrom:
            - configMapRef:
                name: bytesized-config

          # ---- Secrets (individual env vars) ----
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bytesized-secrets
                  key: geminiApiKey
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bytesized-secrets
                  key: redisPassword
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@bytesized-redis:6379/0"

          # ---- Resource Limits ----
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"

          # ---- Liveness Probe: restart if completely hung ----
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ---- Readiness Probe: hold traffic until warm ----
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ---- Startup Probe: give the app 3 minutes to start ----
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 18
            periodSeconds: 10

          # ---- Graceful Shutdown Hook ----
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "PreStop: draining connections..."
                    sleep 10
                    kill -SIGTERM 1

          # ---- Volume Mounts ----
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp

      # ---- Volumes ----
      volumes:
        - name: tmp-dir
          emptyDir:
            sizeLimit: "256Mi"

      # ---- DNS Policy ----
      dnsPolicy: ClusterFirst
      restartPolicy: Always

---
# =============================================================================
# Service — ClusterIP for internal routing by Ingress
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: bytesized-backend
  namespace: bytesized-prod
  labels:
    app.kubernetes.io/name: bytesized
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bytesized
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  sessionAffinity: ClientIP        # sticky sessions for WebSocket (same pod per client IP)
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800        # 3 hours — matches max WebSocket session length

---
# =============================================================================
# ServiceAccount
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bytesized-backend
  namespace: bytesized-prod
  labels:
    app.kubernetes.io/name: bytesized
automountServiceAccountToken: false

---
# =============================================================================
# PodDisruptionBudget — ensure at least 2/3 replicas survive during maintenance
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bytesized-backend-pdb
  namespace: bytesized-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bytesized
      app.kubernetes.io/component: backend
