# =============================================================================
# ByteSized Suite — Kubernetes Application Settings (ConfigMap)
# Non-sensitive runtime environment variables for the backend deployment.
# Reference in Deployment: envFrom.configMapRef.name = bytesized-app-settings
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: bytesized-app-settings
  namespace: bytesized-prod
  labels:
    app.kubernetes.io/name: bytesized
    app.kubernetes.io/component: config
data:
  UVICORN_WORKERS: "4"
  UVICORN_HOST: "0.0.0.0"
  UVICORN_PORT: "8000"
  LOG_LEVEL: "info"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ENVIRONMENT: "production"
  ENABLE_LLM_ENRICHMENT: "true"
  ENABLE_METRICS_ENDPOINT: "true"
  MAX_CODE_SIZE_BYTES: "524288"
  MAX_WS_ROOMS: "10000"
  MAX_CLIENTS_PER_ROOM: "50"
  REQUEST_TIMEOUT_SECONDS: "30"
  CORS_ALLOW_ORIGINS: "*"
  CORS_ALLOW_METHODS: "GET,POST,OPTIONS"
  CORS_ALLOW_HEADERS: "Content-Type,Authorization"
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PATH: "/metrics"
  OTEL_SERVICE_NAME: "bytesized-backend"
  OTEL_TRACES_EXPORTER: "none"
